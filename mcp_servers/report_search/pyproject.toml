[project]
name = "report-search-mcp"
version = "0.1.0"
description = "MCP server for semantic search over local PDF financial reports"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.0.0",
    "markitdown[all]>=0.0.1a2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pymupdf = ["pymupdf4llm>=0.0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_search"]
